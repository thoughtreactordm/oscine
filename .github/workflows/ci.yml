name: CI

# D10 makes Windows and Linux both first-class, which is only true if both are
# checked. A path bug introduced on one is invisible there and obvious on the
# other, so the matrix is the point of this workflow rather than a nicety.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push or a second push to a PR makes the run in flight irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One runner failing is a result about that platform, not a reason to stop
      # learning what the other one would have said.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the ABI story in vitest.config.ts: better-sqlite3's Node-API
          # prebuild has to load under both this Node and Electron's.
          node-version: 24
          cache: npm

      # `npm ci` over `npm install` so the lockfile is what is tested. Native
      # deps resolve to prebuilds on both runners; if that ever stops being true
      # this is the step that will say so, loudly, instead of a later one
      # failing in a way that looks unrelated.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Includes tests/tooling/pathPortability.test.ts, which lints deliberately
      # broken path handling through the real ESLint config and fails if it is
      # not reported. That is W6-1's "prove the check works" acceptance, checked
      # on every run rather than once by hand.
      - name: Test
        run: npm test

      # `build` re-runs typecheck by way of its npm script. Cheap, and it keeps
      # the local command and the CI command the same thing.
      - name: Build
        run: npm run build

      # Runs the emitted worker, decoder and native Web Audio binding together.
      # This is intentionally after Build and matrixed: source tests cannot
      # prove the Windows/Linux worker artifact is actually loadable.
      - name: ReplayGain worker packaging probe
        run: npm run probe:replaygain

      # `verify:native` is deliberately not here. It launches Electron to prove
      # better-sqlite3's prebuild loads under Electron's ABI rather than Node's,
      # which needs a display server on the Linux runner and is the one gate in
      # this repo with a plausible flake mode. It belongs in CI eventually, on
      # its own job where a failure reads as "the native binary broke" and not
      # as "the lint job is red" — W6's packaging work is where that lands.

  # A push to main that carries a new package.json version cuts a release; a push
  # that does not (docs, refactors, anything without a version bump) does nothing
  # here. The version is the whole trigger: keying the tag off it means a release
  # happens exactly once per version and re-running the workflow is idempotent,
  # rather than one release per commit with colliding tags.
  release-gate:
    name: release gate
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      # If a release for v<version> already exists, this push did not bump the
      # version and there is nothing to cut. Otherwise create the draft now, on a
      # single runner, so the two platform builds upload into one release instead
      # of racing to create it.
      - name: Decide and open draft
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # A *published* release for this version means the bump already shipped;
          # skip. A leftover *draft* (a run cancelled or failed mid-build) is
          # reused so a re-run recovers instead of stranding it. Only a missing
          # release opens a fresh draft. Keying on isDraft rather than mere
          # existence is what makes the workflow idempotent under re-runs.
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx 'false'; then
            echo "Release ${TAG} is already published; no version bump on this push."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Reusing existing draft ${TAG} from a prior run."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi

  # Each platform packages itself (electron-builder.yml explains why there is no
  # cross-build): the win runner produces the NSIS installer, the linux runner the
  # AppImage and deb, and both `--publish` their artifacts into the draft release
  # opened above.
  release-build:
    name: release build (${{ matrix.os }})
    needs: release-gate
    if: needs.release-gate.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --publish always

  # Flip the draft to a published release only once both platforms have uploaded,
  # so a release is never visible carrying just one OS's artifacts.
  release-publish:
    name: release publish
    needs: [release-gate, release-build]
    if: needs.release-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Undraft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release-gate.outputs.tag }}" --draft=false
